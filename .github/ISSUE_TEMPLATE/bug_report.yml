name: KruXx bug report
description: Report a reproducible KruXx problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove account data, cookies, tokens and other private information from logs before attaching them.
        KruXx reports belong here—not in the Kreate issue tracker.
  - type: input
    id: version
    attributes:
      label: KruXx version
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      description: KruXx 1.2.0 and later require Android 7.0 (API 24) or newer.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs (optional)
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed cookies, tokens, account data and other private information.
          required: true
