name: KruXx checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kruxx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Java 21
        uses: actions/setup-java@v5.5.0
        with:
          distribution: corretto
          java-version: "21"

      - name: Run KruXx unit tests
        run: ./gradlew :innertube:test :composeApp:testKruxxUniversalProdDebugUnitTest --no-daemon --console=plain

      - name: Build unsigned KruXx debug APK
        run: ./gradlew :composeApp:assembleKruxxUniversalProdDebug --no-daemon --console=plain

      # Production signing keys deliberately never enter GitHub Actions. Official release
      # APKs are built, verified and uploaded locally using scripts/build-local-release.sh.
