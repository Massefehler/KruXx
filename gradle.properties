org.gradle.jvmargs=-Xmx6656M -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableR8.fullMode=true
kotlin.code.style=official

org.gradle.caching=true
org.gradle.configuration-cache=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# InnerTubeX (stream extraction) publishes its AAR with minCompileSdk=37 while Google has not
# shipped "platforms;android-37" yet. The library contains no API-37 calls, so skip AGP's
# compileSdk/AAR-metadata check instead of bumping compileSdk. Remove once compileSdk >= 37.
android.experimental.disableCompileSdkChecks=true
